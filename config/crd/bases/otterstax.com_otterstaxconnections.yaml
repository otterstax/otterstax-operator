---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: otterstaxconnections.otterstax.com
spec:
  group: otterstax.com
  names:
    kind: OtterStaxConnection
    listKind: OtterStaxConnectionList
    plural: otterstaxconnections
    shortNames:
    - osconn
    singular: otterstaxconnection
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.alias
      name: Alias
      type: string
    - jsonPath: .status.conditions[?(@.type=="Accepted")].reason
      name: Kind
      type: string
    - jsonPath: .status.boundServers
      name: Bound
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: OtterStaxConnection is one federated backend addressed by its
          SQL alias.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              OtterStaxConnectionSpec is one federated backend, addressed in SQL by its alias.

              One alias, one object. A server picks connections up by label selector rather
              than naming them, so a connection created later is adopted without editing the
              server. The model is Stackable's TrinoCatalog; the reason is the same.

              Credentials are literal here, or an opaque reference the server resolves
              itself once it learns to. The operator does not resolve secret references: the
              server reads exactly one config file and no environment variables, so anything
              the operator resolved would end up as literal bytes in that file anyway.
            properties:
              alias:
                description: |-
                  Alias is the outermost qualifier in federated SQL: alias.database.table for
                  backends, and the s3_alias in CREATE EXTERNAL TABLE and COPY TO.

                  Uniqueness across a server is not expressible in CEL — it is a cross-object
                  invariant — so the controller refuses to render on a duplicate and the
                  server rejects duplicates at parse time. Neither alone is sufficient.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z_][a-z0-9_]*$
                type: string
              clickhouse:
                description: |-
                  SQLBackend is a MySQL/MariaDB or ClickHouse backend.

                  Note for ClickHouse: the port is the native TCP protocol (9000 by default),
                  not the HTTP interface on 8123. Every config shipped with the server uses the
                  native port.
                properties:
                  database:
                    maxLength: 128
                    minLength: 1
                    type: string
                  host:
                    maxLength: 253
                    minLength: 1
                    type: string
                  password:
                    description: |-
                      Password is literal. See the type comment on the spec for why there is no
                      secret reference here.
                    maxLength: 1024
                    type: string
                  port:
                    description: |-
                      Port is rendered into config.yaml as a STRING, because that is what the
                      server's parser reads for backends — unlike the server's own listener
                      ports, which are integers. Modelled as an integer here so the API is
                      typed; the renderer quotes it.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  table:
                    description: |-
                      Table restricts the connection to a single table. Empty means discover
                      every table in the database, which is the usual case.
                    maxLength: 128
                    type: string
                  username:
                    maxLength: 128
                    minLength: 1
                    type: string
                required:
                - database
                - host
                - username
                type: object
              mysql:
                description: |-
                  SQLBackend is a MySQL/MariaDB or ClickHouse backend.

                  Note for ClickHouse: the port is the native TCP protocol (9000 by default),
                  not the HTTP interface on 8123. Every config shipped with the server uses the
                  native port.
                properties:
                  database:
                    maxLength: 128
                    minLength: 1
                    type: string
                  host:
                    maxLength: 253
                    minLength: 1
                    type: string
                  password:
                    description: |-
                      Password is literal. See the type comment on the spec for why there is no
                      secret reference here.
                    maxLength: 1024
                    type: string
                  port:
                    description: |-
                      Port is rendered into config.yaml as a STRING, because that is what the
                      server's parser reads for backends — unlike the server's own listener
                      ports, which are integers. Modelled as an integer here so the API is
                      typed; the renderer quotes it.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  table:
                    description: |-
                      Table restricts the connection to a single table. Empty means discover
                      every table in the database, which is the usual case.
                    maxLength: 128
                    type: string
                  username:
                    maxLength: 128
                    minLength: 1
                    type: string
                required:
                - database
                - host
                - username
                type: object
              postgresql:
                description: PostgresBackend is a PostgreSQL backend.
                properties:
                  database:
                    maxLength: 128
                    minLength: 1
                    type: string
                  host:
                    maxLength: 253
                    minLength: 1
                    type: string
                  password:
                    maxLength: 1024
                    type: string
                  port:
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  schema:
                    description: |-
                      Schema is the PostgreSQL schema. Left unset the server applies "public".

                      Whether the renderer must OMIT this key rather than emit it empty is a
                      question about the parser, not about taste, and the answer is pinned by
                      the renderer's tests rather than assumed here.
                    maxLength: 128
                    type: string
                  table:
                    maxLength: 128
                    type: string
                  username:
                    maxLength: 128
                    minLength: 1
                    type: string
                required:
                - database
                - host
                - username
                type: object
              s3:
                description: |-
                  S3Backend is an S3 or S3-compatible alias. Unlike the SQL backends it is only
                  recorded at startup, never dialled, so an unreachable endpoint is not retried
                  and does not delay the server coming up.
                properties:
                  accessKey:
                    maxLength: 512
                    minLength: 1
                    type: string
                  endpoint:
                    description: |-
                      Endpoint targets an S3-compatible service such as MinIO.

                      Setting it is not neutral: the server switches the client to plain HTTP
                      and path-style addressing. There is therefore no way to reach an HTTPS
                      S3-compatible endpoint through this field today, and credentials travel
                      in clear text to it.
                    maxLength: 253
                    type: string
                    x-kubernetes-validations:
                    - message: endpoint must be host:port without a scheme; the server
                        forces http and path-style addressing when this is set
                      rule: '!self.startsWith(''http://'') && !self.startsWith(''https://'')'
                  region:
                    maxLength: 64
                    type: string
                  secretKey:
                    maxLength: 512
                    minLength: 1
                    type: string
                  sessionToken:
                    maxLength: 2048
                    type: string
                required:
                - accessKey
                - secretKey
                type: object
            required:
            - alias
            type: object
            x-kubernetes-validations:
            - message: exactly one of mysql, postgresql, clickhouse or s3 must be
                set
              rule: '[has(self.mysql), has(self.postgresql), has(self.clickhouse),
                has(self.s3)].filter(x, x).size() == 1'
          status:
            description: |-
              OtterStaxConnectionStatus reports what the controller can observe about this
              connection. It cannot observe much: the server exposes no admin API, and it
              reaches Ready with zero working backends.
            properties:
              boundServers:
                description: |-
                  BoundServers are the OtterStaxServer names in this namespace whose
                  connectionSelector currently matches this object.
                items:
                  type: string
                maxItems: 32
                type: array
                x-kubernetes-list-type: set
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation this status
                  reflects.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
